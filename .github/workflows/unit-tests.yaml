name: Unit Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: Install dependencies
      run: |
        uv venv
        uv sync

    - name: Run unit tests
      run: |
        uv run pytest tests/unit

  # The Docker images install only some dependency groups. These checks fail
  # when code imports a package that lives in a group the image skips.
  image-dependencies:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: Backend and worker start without dev/frontend groups
      run: |
        uv sync --frozen --no-default-groups
        uv run --no-sync python -c "import src.api.v1.main, src.worker.tasks"

    - name: Frontend starts with only its own group
      run: |
        uv sync --frozen --no-install-project --only-group frontend
        cd frontend
        uv run --no-sync python -c "import config, models, api_client, debate_model, components"
