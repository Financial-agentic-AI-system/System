http_port 8888

acl allowed_dst dstdomain \
    us-central1-aiplatform.googleapis.com \
    oauth2.googleapis.com

acl SSL_ports port 443
acl CONNECT method CONNECT

# HTTPS: only allow CONNECT tunnels to the allowlisted hosts on port 443.
http_access allow CONNECT allowed_dst SSL_ports
http_access deny CONNECT

http_access allow allowed_dst

http_access deny all

# Pure allowlist relay — no need to cache or persist anything.
cache deny all
access_log stdio:/var/log/squid/access.log
