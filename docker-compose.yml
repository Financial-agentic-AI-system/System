services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mas_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mas_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
      - backtest-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
      - backtest-net

  backend:
    env_file:
      - .env
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ../datalake:/datalake:ro 
      - ./.env:/app/.env  
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/mas_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    env_file:
      - .env
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    volumes:
      - ../datalake:/datalake:ro
      - ./.env:/app/.env
      # Google Application Default Credentials (`gcloud auth application-default login`)
      - ${APPDATA}/gcloud:/root/.config/gcloud:ro
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/mas_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend

  # --- Backtest-only services (docs/evaluation.md §2-3.2) ---------------- #
  # Not started by a plain `docker compose up`. Run with:
  #   docker compose --profile backtest up backtest-worker backtest-proxy
  backtest-worker:
    env_file:
      - .env
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    profiles: ["backtest"]
    volumes:
      - ../datalake:/datalake:ro
      - ./.env:/app/.env
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/mas_db
      - REDIS_URL=redis://redis:6379/0
      - HTTP_PROXY=http://backtest-proxy:8888
      - HTTPS_PROXY=http://backtest-proxy:8888
    networks:
      - backtest-net
    depends_on:
      - backtest-proxy

  backtest-proxy:
    image: ubuntu/squid:latest
    profiles: ["backtest"]
    volumes:
      - ./docker/backtest-proxy/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - backtest-net   # reachable by backtest-worker
      - default        # the only backtest-* container with internet

volumes:
  postgres_data:

networks:
  backtest-net:
    internal: true